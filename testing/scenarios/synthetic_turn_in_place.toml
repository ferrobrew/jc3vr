# Synthetic: the recording is written by `cargo run -p tracking-synth` to
# testing/recordings/synthetic/turn_in_place.jc3trk. See docs/mod/testing/recorder.md.
name = "synthetic: turning on the spot"
description = "Turn the whole body 90 degrees left on the spot, the head leading, hold, and turn back."
recording = "../recordings/synthetic/turn_in_place.jc3trk"
start = "in_place"
pacing = "real_time"

[[expect]]
signal = "replay.driving"

[[expect]]
name = "the recorded recenter, and only it, is applied"
signal = "vr.recenters"
equals = 1

[[expect]]
signal = "controllers.frame_fresh"

[[expect]]
name = "the player stays on foot"
signal = "controllers.on_foot"
check = "always"

[[expect]]
name = "the skeleton rigs"
signal = "procedural.rig_error"
check = "never"

[[expect]]
name = "the stick drives nothing"
signal = "locomotion.stick_speed_mps"
check = "always"
below = 0.05

# The body rig (docs/mod/body/rig.md). The thresholds follow the rig's unit tests and are
# provisional until a replay against this build confirms them. Replay on open, level ground: a wall
# or a slope nearby obstructs the chase and fails the open-floor checks.

[[expect]]
name = "the chase keeps up with the head"
signal = "rig.residual_m"
check = "always"
below = 0.05

[[expect]]
name = "the root stays under the head"
signal = "rig.gap_m"
check = "always"
below = 0.05

[[expect]]
name = "the legs stand, stepping on the spot"
signal = "legs.moving"
check = "never"

[[expect]]
name = "nothing obstructs the chase"
signal = "rig.obstructed"
check = "never"

[[expect]]
name = "nothing is pushed back"
signal = "rig.pushbacks"
at_most = 0

# A guess: a character context that filters the wanted velocity sends steps to the projection.
[[expect]]
name = "every step's chase is credited exactly"
signal = "rig.ledger_projected"
at_most = 0

# Not checked, for want of a signal: the torso follows the turn and the view's heading stays
# the turn accumulator's.
