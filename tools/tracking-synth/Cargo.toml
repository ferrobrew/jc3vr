[package]
name = "tracking-synth"
version = "0.1.0"
edition = "2024"
description = "Writes synthetic tracking recordings (.jc3trk) from scripted head and controller paths, so the body rig can be tested without a headset."
publish = false

[dependencies]
glam = { workspace = true }
tracking-format = { path = "../../tracking-format" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
