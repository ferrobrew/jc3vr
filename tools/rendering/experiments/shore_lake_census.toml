# The midday shore lake view of `shore_lake_production.toml`, with the draw census, for the draw accounting.
name = "shore-lake-census"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[visual_overrides]
screen_space_reflections = "enabled"

[diagnostics]
shader_identity = true
draw_census = true

[scene]
position = [7586.867, 1514.6827, -4081.8762]
orientation = [0.073511092, 0.907424474, 0.221448052, -0.34948205]

[scene.environment]
hour = 13.226033
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [7586.867, 1514.6827, -4081.8762]
yaw_deg = 0.0

[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"

[[single_pass_variants]]
name = "veg-off"
diagnostics = true
switches = { vegetation_once = false }
