# The tuning of the hands' grips on characters, the stunt positions, and the held objects'
# impacts: `CharactersTuning` in `src/controllers/physical_hands/characters/tuning.rs`, whose
# fields say what each value does. Every key is required and no other is accepted. Lengths are
# metres, masses kilograms, angles degrees, times seconds or, where the key says so,
# milliseconds, and impulses newton seconds; a share is a fraction in `0..1`.

[characters]
yank_m = 0.2
yank_strength = 1.3
regrip_s = 1.0
ragdoll_retry_after_s = 0.3
shove_min_speed_mps = 1.5
topple_strength = 1.1
ragdoll_carry_strength = 4.0
held_ragdoll_damping_per_s = 4.0
hijack_min_open_deg = 25.0
hijack_door_reach_m = 1.2
min_pane_leg_m = 0.01

[stunt]
reading_stale_after_ms = 200
observation_stale_after_ms = 200
max_tick_s = 0.1
min_strain = 0.1
skid_diameter_m = 0.05
hold_full_speed_mps = 40.0

[stunt.tracker]
roof_offer_m = 0.6
release_grace_s = 0.2
retry_s = 1.0
let_go_timeout_s = 1.0

[impacts]
stale_after_ms = 250
contact_freshness_ms = 100
max_queued = 32
max_recent_contacts = 32
max_native_hits = 64
max_struck_pairs = 64
max_retained = 32

[impacts.strike]
min_speed_mps = 1.5
min_mass_kg = 0.25
max_mass_kg = 20.0
max_speed_mps = 12.0
max_impulse_ns = 120.0
min_impulse_ns = 3.0
repeat_s = 0.35

[impacts.object_damage]
min_impulse_ns = 3.0
health_per_ns = 0.75
max_health = 90.0

[impacts.feedback]
min_speed_mps = 0.8
max_speed_mps = 12.0
min_mass_kg = 0.25
max_mass_kg = 20.0
full_momentum_ns = 24.0
min_share = 0.05
repeat_s = 0.2
