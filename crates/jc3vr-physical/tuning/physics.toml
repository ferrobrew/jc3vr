# The hand bodies' tuning: `PhysicsTuning` in `src/controllers/physical_hands/physics/tuning.rs`,
# whose fields say what each value does. Every key is required and no other is accepted. Lengths
# are metres, masses kilograms, forces newtons, impulses newton seconds, and times seconds, except
# a key ending in `_ms`, which is milliseconds; angles are degrees where the key ends in `_deg` and
# radians where it ends in `_rad`. A share is a fraction of a range, in `0..1`.

