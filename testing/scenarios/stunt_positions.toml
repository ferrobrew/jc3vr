# Template: record the physical skid grip, a normal grapple hang, and a deliberate roof mantle.
name = "keep a physical vehicle grip and deliberately enter a roof stunt"
description = "With moving climbing enabled, grip a helicopter skid while it moves, use a gun in the free hand, and release without entering an animated hang. Separately enter the normal grapple hang and leave through the game controls. Climb a moving car and complete a deliberate mantle onto its roof, then ride with the hands free. See docs/mod/input/stunt-positions.md for destruction, mixed-body, and momentum checks."
recording = "../recordings/stunt_positions.jc3trk"
settle_s = 3.0

[[expect]]
name = "physical grips do not request the animated helicopter hang"
signal = "stunt.hang_entries"
at_most = 0

[[expect]]
name = "the normal grapple hang remains available"
signal = "stunt.hanging"

[[expect]]
name = "the deliberate mantle entered a roof stunt"
signal = "stunt.roof_entries"

[[expect]]
signal = "stunt.standing"

[[expect]]
name = "the torso uses the roof idle hips"
signal = "procedural.roof"
