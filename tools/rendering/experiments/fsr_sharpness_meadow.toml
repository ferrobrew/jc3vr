# FSR's sharpening: the meadow at midday, camera still, single-pass, rendered without the
# sharpening (the shipped setting) and with it at three strengths, against a supersampled reference with no
# anti-aliasing, all in one schedule at one clock and pose. Run with `fast --save` and read with
# `fsr-quality`. See docs/mod/rendering/fsr.md.
name = "fsr-sharpness-meadow"
warmup_frames = 120
samples = 3

[visual_overrides]
fsr = "enabled"

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [4620.3, 1563.5, -3213.5]
yaw_deg = 0.0

[motion]
period_frames = 120
phase = 15

[[configurations]]
mode = "left_only"

[[configurations]]
mode = "single_pass"

[[fsr_variants]]
name = "sharpness-0p2"
sharpness = 0.2
modes = ["single_pass"]

[[fsr_variants]]
name = "sharpness-0"
sharpness = 0.0
modes = ["single_pass"]

[[fsr_variants]]
name = "sharpness-0p5"
sharpness = 0.5
modes = ["single_pass"]

[[fsr_variants]]
name = "reference"
fsr = false
antialiasing = false
resolution_scale = 1.414
modes = ["left_only"]
