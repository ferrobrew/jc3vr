# The IK body's tuning: `IkBodyTuning` in
# crates/jc3vr-body/src/controllers/body/ik_body/tuning.rs, where each value is described.
# Metres, seconds, and shares in 0..1.

[gate]
walk_weight = 0.2
blend_s = 0.25
resume_s = 0.4
max_pelvis_drop_m = 0.2
air_relax = 0.5
toe_height_m = 0.025
root_follow_weight = 0.5

# `body_rig::fk::FkTuning`.
[fk]
smooth_s = 0.12
fallback_blend_s = 0.3

[seed]
reach_share = 0.995
air_knee_down = 0.45
air_knee_ahead = 0.18
air_ankle_down = 0.85
air_ankle_ahead = 0.05

[climb]
hip_cast_share = 1.0
ankle_cast_share = 0.6

# `body_rig::brace::BraceTuning`.
[brace]
reach_share = 0.98
acquire_share = 0.9
min_share = 0.35
min_facing = 0.2
knee_m = 0.15
move_s = 0.3
arc_m = 0.08

[probe]
above_m = 0.6
below_m = 0.9
same_point_m = 0.01
same_height_m = 0.3

[support]
max_predict_s = 0.1

[effectors]
hips = { reach = 1.0, pull = 0.0 }
hips_rotation_reach = 1.0
hips_resist = 1.0
foot = { reach = 1.0, pull = 0.0 }
knee_hint = { reach = 0.2, pull = 0.0 }
air_foot = { reach = 0.6, pull = 0.0 }
