# The hands' tuning: `HandsTuning` in `src/controllers/hands/tuning.rs` and the structs under it
# (`ReachTuning` in `src/controllers/hands/reach.rs`), whose fields say what each value does. Every
# key is required and no other is accepted. Lengths are metres, angles degrees, and times seconds;
# a share or a reach is a fraction in `0..1`. The palm's centre is in the wrist frame (-Z toward
# the fingers, +Y out of the back of the hand).

[tiers]
yield_blend_s = 0.25
return_blend_s = 0.35

[anchor]
blend_s = 0.15
swing_deadzone_m = 0.05
swing_full_m = 0.3
swing_scale = 1.0

[pose]
palm_centre_m = [0.0, -0.01, -0.06]

[reach]
shoulder_smoothing_s = 0.1
chest_shoulder_smoothing_s = 0.5
length_smoothing_s = 0.5
pull_start = 0.9
pull_full = 1.0
pull_max = 0.4
detach_threshold_m = 0.01
detach_cap_m = 0.1
max_forearm_stretch = 1.5

[ik]
secondary_hold_reach = 0.5
wrist_reach_t = 1.0
wrist_reach_r = 1.0
wrist_pull = 0.0
wrist_resist = 0.0

[grip]
auto_turn_deg = 45.0
