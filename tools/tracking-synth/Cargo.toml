[package]
name = "tracking-synth"
version = "0.1.0"
edition = "2024"
description = "Writes synthetic tracking recordings (.jc3trk) from scripted head and controller paths, so the body rig can be tested without a headset, and prints recordings as text or JSON lines."
publish = false

[dependencies]
body-rig = { path = "../../body-rig", features = ["serde"] }
glam = { workspace = true }
serde_json = "1"
tracking-format = { path = "../../tracking-format", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The Rerun SDK, for `export-rerun`. Pinned to the release nixpkgs ships the viewer at, so the
# recordings it writes open in `nix shell nixpkgs#rerun`. Only the SDK, the file sink, and the MP4
# reader that lists a video's frames: no viewer, no server, and no video decoder.
rerun = { version = "=0.40.0", default-features = false, features = ["sdk", "rrd", "video"], optional = true }

[features]
default = ["rerun"]
# `export-rerun`, which writes a recording as a Rerun recording.
rerun = ["dep:rerun"]

[dev-dependencies]
pretty_assertions = "1.4.1"
