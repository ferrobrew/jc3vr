# The true reload's tuning: `ReloadTuning` (`Reload<()>`) in
# `src/controllers/weapons/reload/tuning.rs`, whose fields say what each value does. The switch
# that turns the reload on is a setting, not tuning (`ReloadConfig`). Every key is required and no
# other is accepted. Lengths are metres, speeds metres per second, angles degrees, and times seconds
# unless a key says otherwise (`_ms` is milliseconds, `_radps` radians per second); a share is a
# fraction of a range, in `0..1`. Lengths in `knock` and `zones` are the gun model's metres.

