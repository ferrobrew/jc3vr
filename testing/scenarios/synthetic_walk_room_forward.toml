# Synthetic: the recording is written by `cargo run -p tracking-synth` to
# testing/recordings/synthetic/walk_room_forward.jc3trk. See docs/mod/testing/recorder.md.
name = "synthetic: walking forward in the room"
description = "Walk 1.5 m forward across the room, pause, and step back to the start, the arms swinging."
recording = "../recordings/synthetic/walk_room_forward.jc3trk"
start = "in_place"
pacing = "real_time"

[[expect]]
signal = "replay.driving"

[[expect]]
name = "the recorded recenter, and only it, is applied"
signal = "vr.recenters"
equals = 1

[[expect]]
signal = "controllers.frame_fresh"

[[expect]]
name = "the player stays on foot"
signal = "controllers.on_foot"
check = "always"

[[expect]]
name = "the skeleton rigs"
signal = "procedural.rig_error"
check = "never"

[[expect]]
name = "the stick drives nothing"
signal = "locomotion.stick_speed_mps"
check = "always"
below = 0.05

