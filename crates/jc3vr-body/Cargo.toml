[package]
name = "jc3vr-body"
version = "0.1.0"
edition = "2024"
description = "The body layer of the payload: the player's body, hands, fingers, presentation, grip model, and aim, locomotion and roomscale, the mode detector and the scheme, the haptics, the input vocabulary, the held-item facts, the physics substrate, the published facts, and the character, animation, and input detours."
publish = false

[dependencies]
windows = { workspace = true }
glam = { workspace = true }
jc3gi = { path = "../../jc3gi" }
jc3vr-core = { path = "../jc3vr-core" }
jc3vr-input = { path = "../jc3vr-input" }
jc3vr-view = { path = "../jc3vr-view" }
# The character, animation, and input detours. The detour macro emits `::re_utilities` paths, so a
# crate that defines detours depends on `re-utilities` directly.
re-utilities = { workspace = true }
detours-macro = { workspace = true }
tracking-format = { path = "../tracking-format" }
body-rig = { path = "../body-rig", features = ["serde"] }
# The learned body estimator, run on the game's device through its Direct3D 11 executor.
body-estimator = { path = "../body-estimator" }
tracing = "0.1"
parking_lot = "0.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = "0.3.6"
toml = "1.1.6"

[dev-dependencies]
jc3vr-core = { path = "../jc3vr-core", features = ["test-support"] }
# The tests build the OpenXR poses and times the published tracking carries.
openxr = "0.21"
