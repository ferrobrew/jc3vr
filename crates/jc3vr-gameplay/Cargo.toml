[package]
name = "jc3vr-gameplay"
version = "0.1.0"
edition = "2024"
description = "The gameplay layer of the payload: the controller subsystems built on the body, weapons, physical, vehicles, and grapple layers (the bindings and the summary model), and the look, equipment, and sim detours."
publish = false

[features]
# The in-game profiler's gameplay half (issue #34): the sim step's scopes. The payload's `profiler`
# feature forwards here.
profiler = ["dep:puffin", "jc3vr-core/profiler", "jc3vr-view/profiler"]

[dependencies]
windows = { workspace = true }
glam = { workspace = true }
jc3gi = { path = "../../jc3gi" }
jc3vr-core = { path = "../jc3vr-core" }
jc3vr-input = { path = "../jc3vr-input" }
jc3vr-view = { path = "../jc3vr-view" }
# The body layer below: the body-bound subsystems, the shared vocabulary, facts, and physics
# substrate, and the character, animation, and input detours.
jc3vr-body = { path = "../jc3vr-body" }
# The weapons layer below: the weapon handling and the loadout table.
jc3vr-weapons = { path = "../jc3vr-weapons" }
# The physical layer beside the weapons: the physical hands and the glass.
jc3vr-physical = { path = "../jc3vr-physical" }
# The vehicles layer below: vehicles, mounted guns, the wingsuit, and the parachute.
jc3vr-vehicles = { path = "../jc3vr-vehicles" }
# The grapple layer beside the vehicles: the grapple and the snatch.
jc3vr-grapple = { path = "../jc3vr-grapple" }
# The gameplay detours. The detour macro emits `::re_utilities` paths, so a crate that defines
# detours depends on `re-utilities` directly.
re-utilities = { workspace = true }
detours-macro = { workspace = true }
tracking-format = { path = "../tracking-format" }
body-rig = { path = "../body-rig", features = ["serde"] }
tracing = "0.1"
# Same rev as the payload's `puffin_egui`, so both agree on the puffin data model.
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "d06bed0fcb8c8e4c78643d4ead7cf1de9b76fd3b", optional = true }
parking_lot = "0.12.5"
arc-swap = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = "0.3.6"
toml = "1.1.6"

[dev-dependencies]
jc3vr-core = { path = "../jc3vr-core", features = ["test-support"] }
# The tests build the OpenXR poses and times the published tracking carries.
openxr = "0.21"
pretty_assertions = "1.4.1"
proptest = "1.11.0"
test-case = "3.3.1"
