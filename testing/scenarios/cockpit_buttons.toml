# Template: fill testing/recordings/cockpit_buttons.jc3trk, then run. See docs/mod/testing/recorder.md.
name = "work the horn and the nitrous by hand"
description = "Recorded seated in a parked car with the nitrous upgrade, with the physical wheel and the cockpit buttons on (cockpit-controls.md, the buttons checklist). Take the wheel with one hand, push the other into the hub for the horn twice, then press the nitrous button beside the wheel while driving, hold it, and let go."
recording = "../recordings/cockpit_buttons.jc3trk"
