# The weapon handling's hold tuning: `HoldFileTuning` in
# `src/controllers/weapons/hold/tuning.rs`, whose fields say what each value does. Every key is
# required and no other is accepted. Lengths are metres (player-scale where the field says so),
# speeds metres per second, and times seconds (`_s`) or whole milliseconds (`_ms`); a share or a
# fraction is in `0..1`.

[hold]
snap_s = 0.12
max_throw_mps = 15.0
handle_radius_m = 0.14
handover_max_m = 0.20
take_radius_m = 0.3
steal_radius_m = 0.4
release_intent_s = 0.35
use_item_grant_ms = 500
target_max_age_ms = 250
release_max_age_s = 0.15
max_carried_mps = 150.0

[hold.steal]
notice_range_m = 3.0
seen_for_ms = 500
over_stumble = 1.1
under_ragdoll = 0.9

[hold.swap]
eject_mps = 1.5
eject_lift = 0.4

[hold.rack]
restock_after_ms = 800
copy_wait_ms = 3000

[hold.rack.paired]
source_grace_ms = 3000
copy_wait_ms = 3000
stack_m = 0.045

[begin]
gun_volume_margin_m = 0.01
gun_volume_depth = 0.95

[begin.marks]
min_m = 0.03
max_m = 0.12
charge_m = 0.08
foregrip_m = 0.03

[docks]
attachments_max_age_ms = 250

[docks.attraction]
shoulder_m = 0.675
hip_m = 0.3
back_front_m = 0.08
back_floor_m = 0.3
hip_front_m = 0.25
back_max_speed_mps = 5.0
hip_max_speed_mps = 3.5
speed_window_s = 0.1
travel_mps = 1.5
max_travel_s = 0.35
exit_margin_m = 0.03

# The volumes ride the character's skeleton. Offsets are in the body frame (+X right, +Y up, +Z
# back), given for the right side and mirrored for the left; angles here are radians.
[volumes]
back_reach_offset_m = [0.05, -0.12, 0.0]
look_down_start_rad = 0.17
look_down_full_rad = 0.7
bend_full_rad = 0.52
bend_none_rad = 0.87
belt_rise_fraction = 0.17
belt_out_fraction = 0.12
belly_front_m = 0.03
chest_pouch_drop_fraction = 0.22
chest_pouch_out_fraction = 0.52
chest_front_m = 0.02

[volumes.sockets]
hip_radius_m = 0.22
shoulder_radius_m = 0.255

[volumes.pouches]
reach_margin_m = 0.05

[volumes.pouches.grenade]
offset_m = [0.0, -0.02, 0.04]
radius_m = 0.09

[volumes.pouches.c4]
offset_m = [-0.10, -0.02, 0.04]
radius_m = 0.1

[volumes.pouches.magazine]
offset_m = [0.0, 0.0, -0.04]
radius_m = 0.075

[volumes.stride]
smoothing_s = 0.2
max_lag_m = 0.12
max_dt_s = 0.1
