samples = 3
interval_seconds = 2.0

[diagnostics]
shader_identity = true

[scene.environment]
hour = 18.6
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [4620.3, 1563.5, -3213.5]
yaw_deg = 0.0

[motion]
period_frames = 120
phase = 15

[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"

[[single_pass_variants]]
name = "veg-off"
switches = { vegetation_once = false }
