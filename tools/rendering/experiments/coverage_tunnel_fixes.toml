# Coverage: inside a lit road tunnel, at 13 h in clear weather, at the fixed camera of the earlier attribution configs.
# Measures the ambient-occlusion volume and road clip-origin fixes against same-schedule variants with each switched off.
name = "coverage-tunnel-fixes"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[diagnostics]
shader_identity = true
draw_census = true

[scene]
position = [10623.576, 1205.4075, 5414.4355]
orientation = [-0.00998667, 0.96107894, -0.018140897, 0.27549666]

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [10620.9, 1204.4, 5412.4]
yaw_deg = 148.0


[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"

[[single_pass_variants]]
name = "ao-volumes-off"
switches = { ao_volumes_per_eye = false }

[[single_pass_variants]]
name = "clip-origin-off"
switches = { clip_origin_per_eye = false }
