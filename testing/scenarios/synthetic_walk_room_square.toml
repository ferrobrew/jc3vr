# Synthetic: the recording is written by `cargo run -p tracking-synth` to
# testing/recordings/synthetic/walk_room_square.jc3trk. See docs/mod/testing/recorder.md.
name = "synthetic: walking a square in the room"
description = "Walk a 1.5 m square clockwise, turning the whole body right at each corner."
recording = "../recordings/synthetic/walk_room_square.jc3trk"
start = "in_place"
pacing = "real_time"

[[expect]]
signal = "replay.driving"

[[expect]]
name = "the recorded recenter, and only it, is applied"
signal = "vr.recenters"
equals = 1

[[expect]]
signal = "controllers.frame_fresh"

[[expect]]
name = "the player stays on foot"
signal = "controllers.on_foot"
check = "always"

[[expect]]
name = "the skeleton rigs"
signal = "procedural.rig_error"
check = "never"

[[expect]]
name = "the stick drives nothing"
signal = "locomotion.stick_speed_mps"
check = "always"
below = 0.05

# TODO(body rig): expectations for the signals the new body rig will add:
# - the torso's heading follows each corner's turn.
# - the roomscale chase follows the head round the square and closes it.
# - the view turns only by the player's own turns, never by a reorientation.
