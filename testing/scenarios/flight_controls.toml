name = "fly a plane with the stick and throttle"
description = "Recorded seated in a parked plane with the physical flight stick and throttle on and the afterburner gate on (steering-wheel.md, the flight stick and throttle checklist). Take the throttle and push it to the stop through the gate, take the stick and fly, twisting it for the rudder, let go of the stick to watch it centre, bring the throttle back to idle, and land or bail out."
