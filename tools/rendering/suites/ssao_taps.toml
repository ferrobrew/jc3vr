# The ambient occlusion's eye-local taps, against a same-schedule variant with them off, at the
# town, the meadow, and the shore. See "SSAO, per eye in one run" in
# docs/mod/stereo/single-pass-collapse-defects.md.

[[scene]]
name = "town"
config = "ssao_taps_town.toml"

[[scene]]
name = "meadow"
config = "ssao_taps_meadow.toml"

[[scene]]
name = "shore"
config = "ssao_taps_shore.toml"
[scene.stage]
settle_seconds = 20.0
location = { position = [7586.867, 1514.6827, -4081.8762], yaw_deg = 0.0 }
