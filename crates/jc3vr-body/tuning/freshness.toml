estimator_eyes_ms = 250
estimate_ms = 500
ik_support_ms = 250
ik_fk_ms = 250
ik_gate_ms = 250
procedural_gate_ms = 500
procedural_local_ms = 250
firm_ragdoll_source_ms = 250

[rig]
