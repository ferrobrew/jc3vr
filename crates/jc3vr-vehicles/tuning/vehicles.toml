# The vehicles' tuning: `VehiclesTuning` in `src/controllers/vehicles/tuning/mod.rs` and the
# structs under it, whose fields say what each value does. Every key is required and no other is
# accepted. Lengths are metres, angles degrees, and times seconds, or milliseconds where the key
# ends in `_ms`; a share is a fraction of a range, in `0..1`.
#
# The physical controls sit in the seated character's body frame (+X right, +Y up, +Z back) with
# the eyes at the origin, given for a right-handed layout.

[physical]
grab_radius_m = 0.09

[physical.wheel]
centre_m = [0.0, -0.42, -0.40]
radius_m = 0.19
tilt_deg = 25.0
response = 1.0
deadzone_deg = 2.0
return_deg_per_s = 360.0

[physical.handlebars]
centre_m = [0.0, -0.50, -0.45]
half_width_m = 0.34
max_steer_deg = 30.0
deadzone_deg = 3.0
response = 1.6
grab_radius_m = 0.16
grab_from_middle = 0.35
grab_past_end = 1.15

[physical.cyclic]
top_m = [0.12, -0.78, -0.30]
max_deflection_m = 0.12
deadzone = 0.05
return_s = 0.12

[physical.collective]
