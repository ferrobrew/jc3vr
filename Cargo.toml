[workspace]
members = [
    # Runtime: the injector, the injected payload, and the game bindings.
    "injector",
    "payload",
    "jc3gi",
    # Shared libraries used by the payload and the offline tools.
    "crates/body-estimator",
    "crates/body-rig",
    "crates/dxbc-stereo",
    "crates/fsr-sys",
    "crates/jc3vr-body",
    "crates/jc3vr-capture",
    "crates/jc3vr-core",
    "crates/jc3vr-gameplay",
    "crates/jc3vr-hud",
    "crates/jc3vr-input",
    "crates/jc3vr-physical",
    "crates/jc3vr-render",
    "crates/jc3vr-tooling",
    "crates/jc3vr-ui",
    "crates/jc3vr-vehicles",
    "crates/jc3vr-view",
    "crates/jc3vr-weapons",
    "crates/tracking-format",
    # Offline tools.
    "tools/dxbc-tool",
    "tools/scaleform-gfx-examine",
    "tools/shadergen",
    "tools/tracking-synth",
    # Repository checks.
    "crates/layering-guard",
]
resolver = "3"
default-members = ["injector"]

[workspace.dependencies]
anyhow = "1.0"
cc = "1"
glam = { version = "0.30.8", features = ["serde"] }

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_Kernel",
] }

# re-utilities = { path = "../re-utilities/utilities" }
re-utilities = { git = "https://github.com/ferrobrew/re-utilities.git" }

# re-utilities-injector = { path = "../re-utilities/injector" }
re-utilities-injector = { git = "https://github.com/ferrobrew/re-utilities.git" }

# detours-macro = { path = "../re-utilities/detours-macro" }
detours-macro = { git = "https://github.com/ferrobrew/re-utilities.git" }

# pyxis = { path = "../pyxis" }
pyxis = { git = "https://github.com/ferrobrew/pyxis.git" }

# Abort on panic rather than unwinding. The payload's detours hold raw pointers into engine state
# that is not safe to drop through, and unwinding across a FFI boundary (the detour trampolines) is
# UB. The panic hook in `crash.rs` still fires before the abort, so crash logs are written.
[profile.dev]
panic = "abort"

# Optimize the PNG-encode chain even in dev builds: the render-trace screenshot diagnostic encodes
# many full-resolution frames, and unoptimized deflate makes a capture crawl. These are third-party
# crates, so optimizing them does not slow iteration on our own code.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

# Keep line tables in release. Without them a release hang or crash symbolizes to a bare RVA, which
# is what made the allocator deadlock in `uninstall_com_detours` take a session to pin down. Costs
# image size, not speed.
[profile.release]
debug = 1
panic = "abort"
