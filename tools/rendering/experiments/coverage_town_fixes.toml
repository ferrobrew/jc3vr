# Coverage: a coastal town's streets, at 13 h in clear weather, at the fixed camera of the earlier attribution configs.
# Measures the ambient-occlusion volume and road clip-origin fixes against same-schedule variants with each switched off.
name = "coverage-town-fixes"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[diagnostics]
shader_identity = true
draw_census = true

[scene]
position = [2091.0774, 1040.3096, 5004.919]
orientation = [-0.0058669983, -0.6749365, 0.008377615, 0.73780495]

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [2091.2, 1040.1, 5005.0]
yaw_deg = 270.0


[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"

[[single_pass_variants]]
name = "ao-volumes-off"
switches = { ao_volumes_per_eye = false }

[[single_pass_variants]]
name = "clip-origin-off"
switches = { clip_origin_per_eye = false }
