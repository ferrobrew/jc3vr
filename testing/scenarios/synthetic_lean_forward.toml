# Synthetic: the recording is written by `cargo run -p tracking-synth` to
# testing/recordings/synthetic/lean_forward.jc3trk. See docs/mod/testing/recorder.md.
name = "synthetic: leaning over a table"
description = "Replayed with the procedural body on. Lean from the hips over a table, the head 35 cm forward and 20 cm down, hold, and return."
recording = "../recordings/synthetic/lean_forward.jc3trk"
start = "in_place"
pacing = "real_time"

[[expect]]
signal = "replay.driving"

[[expect]]
name = "the recorded recenter, and only it, is applied"
signal = "vr.recenters"
equals = 1

[[expect]]
signal = "controllers.frame_fresh"

[[expect]]
name = "the player stays on foot"
signal = "controllers.on_foot"
check = "always"

[[expect]]
name = "the skeleton rigs"
signal = "procedural.rig_error"
check = "never"

[[expect]]
signal = "procedural.on_foot"

# A loose bound until a baseline run against the body rig sets a tighter one.
[[expect]]
name = "the solved neck stays under the head"
signal = "procedural.neck_error_m"
check = "always"
below = 0.10

[[expect]]
name = "the stick drives nothing"
signal = "locomotion.stick_speed_mps"
check = "always"
below = 0.05

# The body rig (docs/mod/body/rig.md). The thresholds follow the rig's unit tests and are
# provisional until a replay against this build confirms them. Replay on open, level ground: a wall
# or a slope nearby obstructs the steps and fails the open-floor checks.

[[expect]]
name = "the head never asks for a step"
signal = "rig.residual_m"
check = "always"
below = 0.05

# The pelvis solver reads a lean about the hips as a bend, so the neck stays out over the pelvis.
[[expect]]
name = "the lean is left to the head"
signal = "rig.gap_m"
check = "eventually"
above = 0.05

[[expect]]
name = "the body does not step"
signal = "rig.stepping"
check = "never"

# A step ends within the arrival radius and slides the rest out.
[[expect]]
name = "the root settles under the head once upright"
signal = "rig.gap_m"
check = "at_end"
below = 0.06

[[expect]]
name = "nothing obstructs the steps"
signal = "rig.obstructed"
check = "never"

[[expect]]
name = "nothing is pushed back"
signal = "rig.pushbacks"
at_most = 0

# A guess: a character context that filters the wanted velocity sends steps to the projection.
[[expect]]
name = "every step's drive is credited exactly"
signal = "rig.ledger_projected"
at_most = 0
