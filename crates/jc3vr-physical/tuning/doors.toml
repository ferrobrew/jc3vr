# The vehicle doors' tuning: `DoorsTuning` in `src/controllers/physical_hands/doors/tuning.rs`,
# whose fields say what each value does. Every key is required and no other is accepted. Lengths
# are metres of the player's hand, angles degrees or radians as the key's suffix says, speeds per
# second, and times seconds; a share is a fraction of a range, in `0..1`.

