[package]
name = "jc3vr-view"
version = "0.1.0"
edition = "2024"
description = "The view layer of the payload: the OpenXR runtime and input sampling, the head pose, the camera and window-focus detours, the frame state the render layer reads per draw, the tracking recorder, and the registries the render hooks share with the layers above."
publish = false

[features]
# The in-game profiler's view half (issue #34): the frame loop's and the frame tail's scopes, and
# the benchmark's render-pass totals. The payload's `profiler` feature forwards here.
profiler = ["dep:puffin", "jc3vr-core/profiler"]

[dependencies]
windows = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
jc3gi = { path = "../../jc3gi" }
jc3vr-core = { path = "../jc3vr-core" }
jc3vr-input = { path = "../jc3vr-input" }
# The camera and window-focus detours. The detour macro emits `::re_utilities` paths, so a crate
# that defines detours depends on `re-utilities` directly.
re-utilities = { workspace = true }
detours-macro = { workspace = true }
# The jitter sequence FSR expects, which the frame's projections carry.
fsr-sys = { path = "../fsr-sys" }
tracking-format = { path = "../tracking-format" }
body-rig = { path = "../body-rig" }
# Runtime-loaded (`loaded` default feature): the OpenXR loader is opened at runtime via
# `xr::Entry::load_from`, not linked, so an `openxr_loader.dll` must sit beside the payload DLL (see
# the `vr` module docs). The `static` feature would build the loader in and drop that DLL, but it does
# not cross-build cleanly on Linux: with cmake + ninja added it compiles the loader, then CMake feeds
# the Windows resource step (`loader.rc`) a spurious Clang `-fPIC` that clang-cl rejects, and the fix
# (`CMAKE_POSITION_INDEPENDENT_CODE=OFF`) does not stick because cargo-xwin regenerates its toolchain
# file every build. So the dynamic route stays the portable choice.
openxr = "0.21"
tracing = "0.1"
# The eye captures register their textures with the debug UI's renderer.
egui = "0.35"
egui-directx11 = "0.13"
# Same rev as the payload's `puffin_egui`, so both agree on the puffin data model.
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "d06bed0fcb8c8e4c78643d4ead7cf1de9b76fd3b", optional = true }
# `send_guard`: the VR frame context carries the runtime lock's guard for the frame, and the
# deferred frame tail hands that context to the tail thread to submit.
parking_lot = { version = "0.12.5", features = ["send_guard"] }
serde = { version = "1", features = ["derive"] }
# The input self-check's record of the runtimes and controllers it has checked.
toml = "1.1.6"

[dev-dependencies]
jc3vr-core = { path = "../jc3vr-core", features = ["test-support"] }
pretty_assertions = "1.4.1"
test-case = "3.3.1"
