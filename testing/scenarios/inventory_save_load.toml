# Template: fill testing/recordings/inventory_save_load.jc3trk, then run. See docs/mod/testing/recorder.md.
name = "carried rifles across a save and a load"
description = "Recorded right-handed with two extra rifles carried on the back, standing at a safehouse (vr-inventory.md, the checklist, item 18). Save at the safehouse, open the pause menu, load the save just made, and stand still until the load ends."
recording = "../recordings/inventory_save_load.jc3trk"
settle_s = 15.0

[[expect]]
name = "the save wrote the sidecar"
signal = "inventory.sidecar_writes"

[[expect]]
name = "the load reset the spawn system"
signal = "inventory.resets"

[[expect]]
name = "both rifles came back"
signal = "inventory.restored"
at_least = 2

[[expect]]
name = "and are carried at the end"
signal = "inventory.carried"
check = "at_end"
at_least = 2

[[expect]]
status = "LAST LOAD"
