# Coverage: inside a lit road tunnel, at 13 h in clear weather.
# A fixed camera at the pose the static-motion midday config observed in run 260, with the draw census and switch-off variants for attribution.
name = "coverage-tunnel-census"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[diagnostics]
shader_identity = true
draw_census = true

[scene]
position = [10623.576, 1205.4075, 5414.4355]
orientation = [-0.00998667, 0.96107894, -0.018140897, 0.27549666]

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [10620.9, 1204.4, 5412.4]
yaw_deg = 148.0


[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"
[[single_pass_variants]]
name = "clustered-off"
switches = { clustered_per_eye = false }

[[single_pass_variants]]
name = "lights-off"
switches = { local_lights_per_eye = false }

[[single_pass_variants]]
name = "pixcam-off"
switches = { pixel_camera_per_eye = false }

[[single_pass_variants]]
name = "hwi-off"
diagnostics = true
switches = { hw_instanced_once = false }
