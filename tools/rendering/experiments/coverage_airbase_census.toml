# Coverage: inside a hangar at a military airport, at 13 h in clear weather.
# A fixed camera at the pose the static-motion midday config observed in run 260, with the draw census and switch-off variants for attribution.
name = "coverage-airbase-census"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[visual_overrides]
screen_space_reflections = "enabled"

[diagnostics]
shader_identity = true
draw_census = true

[scene]
position = [974.08105, 1619.3912, -5744.1333]
orientation = [-0.0155930165, -0.9982827, 0.00012206985, 0.0564667]

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [974.2, 1618.8, -5744.3]
yaw_deg = 186.0


[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"
[[single_pass_variants]]
name = "clustered-off"
switches = { clustered_per_eye = false }

[[single_pass_variants]]
name = "lights-off"
switches = { local_lights_per_eye = false }
