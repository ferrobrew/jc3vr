[package]
name = "jc3vr_payload"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["profiler"]
# The in-game profiler (issue #34): puffin scopes across the mod's hooks and the engine's frame
# phases, a flame-graph panel in the Performance tab, and on-demand trace capture to disk.
# Compile-time so the extra hooks and per-scope overhead vanish entirely when disabled.
profiler = [
    "dep:puffin",
    "jc3vr-core/profiler",
    "jc3vr-render/profiler",
    "jc3vr-view/profiler",
    "jc3vr-capture/profiler",
    "jc3vr-gameplay/profiler",
    "jc3vr-ui/profiler",
]

[dependencies]
windows = { workspace = true }
re-utilities = { workspace = true }
detours-macro = { workspace = true }

jc3gi = { path = "../jc3gi" }
# The core layer: the lifecycle, the configuration engine, the hook plumbing, and frame timing.
jc3vr-core = { path = "../crates/jc3vr-core" }
# The render layer: the OpenXR runtime, the head pose, stereo, FSR, the far field, the
# engine-pipeline hooks, and the render diagnostics.
jc3vr-render = { path = "../crates/jc3vr-render" }
jc3vr-view = { path = "../crates/jc3vr-view" }
# The body layer: the body-bound controller subsystems, the shared vocabulary, facts, and physics
# substrate, and the character, animation, and input detours.
jc3vr-body = { path = "../crates/jc3vr-body" }
# The capture layer: the screenshot harness and its probes, the visual stage's controls, and the
# benchmark samplers.
jc3vr-capture = { path = "../crates/jc3vr-capture" }
# The physical layer: the physical hands and breaking window glass.
jc3vr-physical = { path = "../crates/jc3vr-physical" }
# The gameplay layer: the weapon handling, the vehicles, the bindings, the summary model, the
# grapple, and the look, equipment, and sim detours.
jc3vr-gameplay = { path = "../crates/jc3vr-gameplay" }
# The HUD layer: the floating panel and its layers, the summary's presentation, the controls map,
# the UI detours, and the egui renderer.
jc3vr-hud = { path = "../crates/jc3vr-hud" }
# The tooling layer: the video recorder, the directing tools, the capture harness's request file and
# staging, and the diagnostics samplers.
jc3vr-tooling = { path = "../crates/jc3vr-tooling" }
# The UI layer: the debug UI shell and its panels, the status rows, the pause menu with its VR
# pages, and the profiler's Performance panel.
jc3vr-ui = { path = "../crates/jc3vr-ui" }

tracing = "0.1"
egui = "0.35"
# Same rev as the UI crate's `puffin_egui`, so both agree on the puffin data model.
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "d06bed0fcb8c8e4c78643d4ead7cf1de9b76fd3b", optional = true }
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1.1.6"

[build-dependencies]
jiff = "0.2.29"

[dev-dependencies]
glam = { workspace = true }
# The configuration tests build settings that name a hand.
jc3vr-input = { path = "../crates/jc3vr-input" }
serde_json = "1"
jc3vr-core = { path = "../crates/jc3vr-core", features = ["test-support"] }
jc3vr-view = { path = "../crates/jc3vr-view", features = ["test-support"] }
pretty_assertions = "1.4.1"
