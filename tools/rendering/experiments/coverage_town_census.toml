# Coverage: a coastal town's street lamps, at 13 h in clear weather.
# A fixed camera at the pose the static-motion midday config observed in run 260, with the draw census and switch-off variants for attribution.
name = "coverage-town-census"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[visual_overrides]
screen_space_reflections = "enabled"

[diagnostics]
shader_identity = true
draw_census = true

[scene]
position = [2091.0774, 1040.3096, 5004.919]
orientation = [-0.0058669983, -0.6749365, 0.008377615, 0.73780495]

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [2091.2, 1040.1, 5005.0]
yaw_deg = 270.0


[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"
[[single_pass_variants]]
name = "pixcam-off"
switches = { pixel_camera_per_eye = false }

[[single_pass_variants]]
name = "terrain-off"
switches = { terrain = false }

[[single_pass_variants]]
name = "doors-off"
switches = { screen_door_per_eye = false }
