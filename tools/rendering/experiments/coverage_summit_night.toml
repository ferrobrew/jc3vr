# Coverage: a mountain-top transmitter base, at 22.5 h in clear weather.
name = "coverage-summit-night"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[diagnostics]
shader_identity = true

[scene.environment]
hour = 22.5
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [10069.6, 1450.1, 5134.1]
yaw_deg = 41.0

[motion]
period_frames = 120
phase = 15

[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"
