# Standing regression: the coastal town with every shipped setting on (see shipped_town_static.toml),
# camera rotating, so FSR's history and motion vectors are exercised.
name = "shipped-town-rotation"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[visual_overrides]
screen_space_reflections = "enabled"
fsr = "enabled"
foveation = "enabled"
auto_exposure = "enabled"
screen_fade = "enabled"
player_damage = "enabled"

[diagnostics]
shader_identity = true

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [2091.2, 1040.1, 5005.0]
yaw_deg = 270.0

[motion]
period_frames = 120
yaw_deg = 15.0
pitch_deg = 5.0
phase = 15

[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"

[[single_pass_variants]]
name = "fsr-off"
switches = { fsr_per_eye = false }

[[single_pass_variants]]
name = "fov-off"
switches = { foveation_per_eye = false }
