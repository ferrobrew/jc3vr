# The vehicles' tuning: `VehiclesTuning` in `src/controllers/vehicles/tuning.rs`, whose fields say
# what each value does. Every key is required and no other is accepted. Lengths are metres, angles
# degrees, and times seconds; a share is a fraction of a range, in `0..1`.
#
# The physical controls sit in the seated character's body frame (+X right, +Y up, +Z back) with
# the eyes at the origin, given for a right-handed layout.

[physical]
grab_radius_m = 0.09

[physical.wheel]
centre_m = [0.0, -0.42, -0.40]
radius_m = 0.19
tilt_deg = 25.0
response = 1.0
deadzone_deg = 2.0
return_deg_per_s = 360.0

[physical.handlebars]
centre_m = [0.0, -0.50, -0.45]
half_width_m = 0.34
max_steer_deg = 30.0
deadzone_deg = 3.0
response = 1.6
grab_radius_m = 0.16

[physical.cyclic]
top_m = [0.12, -0.78, -0.30]
max_deflection_m = 0.12
deadzone = 0.05
return_s = 0.12

[physical.collective]
rest_m = [-0.28, -0.80, -0.10]
axis = "Vertical"
travel_m = 0.30
detent = 0.1
hold_on_release = false

[physical.flight_stick]
top_m = [0.10, -0.75, -0.32]
max_deflection_m = 0.10
deadzone = 0.05
return_s = 0.12

[physical.throttle]
rest_m = [-0.28, -0.70, -0.20]
axis = "ForeAft"
travel_m = 0.24
detent = 0.1
hold_on_release = true

[physical.yoke]
max_roll_deg = 75.0
travel_m = 0.08
deadzone = 0.05
return_s = 0.12

[physical.flight]
twist_deadzone_deg = 6.0
twist_full_deg = 35.0
afterburner_gate = true
gate_at = 0.85
reverse_share = 0.33333334
zero_pull = 0.12
zero_snap = 0.06
thrust_step = 0.1

[physical.buttons]
horn = true
hub_share = 0.35
nitrous_button = true
nitrous_from_rim_m = [0.12, 0.02, 0.0]
nitrous_radius_m = 0.045
press_depth_m = 0.02
twist_nitrous = true
twist_deg = 40.0

[arm_steering]
deadzone_m = 0.04
full_bank_m = 0.45

# Distances here are shares of the calibrated arm span.
[wingsuit_gestures]
flight_lateral_span = 0.23
flight_angle_deg = 45.0
withdraw_lateral_span = 0.10
withdraw_lowered_span = 0.18
withdraw_reach_span = 0.24
pose_hysteresis_span = 0.03
flight_roll_deg = 40.0
brake_roll_deg = 60.0
brake_roll_max_deg = 150.0
neutral_dwell_s = 0.12
flight_dwell_s = 0.20
close_dwell_s = 0.30
brake_dwell_s = 0.12
max_sample_gap_s = 0.20

[wingsuit_evade]
throw_bank_deg = 50.0
throw_sweep_deg = 45.0
throw_window_s = 0.3
rearm_bank_deg = 25.0
cooldown_s = 1.5
diagonal_pitch = 0.6

[parachute_handles]
full_pull_m = 0.30
brake_threshold = 0.2

[ripcord]
pull_m = 0.15

[rail]
half_length_m = 1.0
step_off_m = 0.35
pull_s = 0.25
