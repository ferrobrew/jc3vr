# Coverage: a walled yard at a military harbour, at 22.5 h in clear weather.
name = "coverage-harbor-night"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[visual_overrides]
screen_space_reflections = "enabled"

[diagnostics]
shader_identity = true

[scene.environment]
hour = 22.5
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [-1291.2, 1029.5, 5273.9]
yaw_deg = 197.0

[motion]
period_frames = 120
phase = 15

[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"
