[package]
name = "jc3vr-gameplay"
version = "0.1.0"
edition = "2024"
description = "The gameplay layer of the payload: the controller subsystems (bindings, weapons, the physical hands, the body, the vehicles, the hands, aim, locomotion, and roomscale), the grapple, and the character, animation, input, equipment, and sim detours."
publish = false

[features]
# The in-game profiler's gameplay half (issue #34): the sim step's scopes. The payload's `profiler`
# feature forwards here.
profiler = ["dep:puffin", "jc3vr-core/profiler", "jc3vr-render/profiler"]

[dependencies]
windows = { workspace = true }
glam = { workspace = true }
jc3gi = { path = "../../jc3gi" }
jc3vr-core = { path = "../jc3vr-core" }
jc3vr-input = { path = "../jc3vr-input" }
jc3vr-render = { path = "../jc3vr-render" }
# The gameplay detours. The detour macro emits `::re_utilities` paths, so a crate that defines
# detours depends on `re-utilities` directly.
re-utilities = { workspace = true }
detours-macro = { workspace = true }
tracking-format = { path = "../tracking-format" }
body-rig = { path = "../body-rig", features = ["serde"] }
# The learned body estimator, run on the game's device through its Direct3D 11 executor.
body-estimator = { path = "../body-estimator" }
tracing = "0.1"
# Same rev as the payload's `puffin_egui`, so both agree on the puffin data model.
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "d06bed0fcb8c8e4c78643d4ead7cf1de9b76fd3b", optional = true }
parking_lot = "0.12.5"
arc-swap = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = "0.3.6"
toml = "1.1.6"

[dev-dependencies]
jc3vr-core = { path = "../jc3vr-core", features = ["test-support"] }
jc3vr-render = { path = "../jc3vr-render", features = ["test-support"] }
# The tests build the OpenXR poses and times the published tracking carries.
openxr = "0.21"
pretty_assertions = "1.4.1"
proptest = "1.11.0"
test-case = "3.3.1"
