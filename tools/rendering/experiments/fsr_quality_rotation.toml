# FSR's image quality: the coastal town at midday, camera rotating. Rendered with FSR as shipped, FSR without its
# sub-pixel jitter, the game's own anti-aliasing (SMAA 1x), no anti-aliasing at all, and a
# supersampled reference, all in one schedule at one clock and pose. Run with `fast --save` and
# read with `fsr-quality`. See docs/mod/rendering/fsr.md.
name = "fsr-quality-rotation"
warmup_frames = 120
# FSR's history settles about 64 frames after a reset at a still camera (docs/mod/rendering/fsr.md).
samples = 3

[visual_overrides]
screen_space_reflections = "enabled"
fsr = "enabled"

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [2091.2, 1040.1, 5005.0]
yaw_deg = 270.0

[motion]
period_frames = 120
yaw_deg = 15.0
pitch_deg = 5.0
phase = 15

[[configurations]]
mode = "left_only"

[[configurations]]
mode = "single_pass"

[[fsr_variants]]
name = "jitter-off"
jitter = false

[[fsr_variants]]
name = "fsr-off"
fsr = false

[[fsr_variants]]
name = "no-aa"
fsr = false
antialiasing = false

# The reference: twice the pixels (each side scaled by the square root of two) with no
# anti-aliasing, downsampled offline by area, so it favours no anti-aliasing method.
[[fsr_variants]]
name = "reference"
fsr = false
antialiasing = false
resolution_scale = 1.414
modes = ["left_only"]
