# Coverage: the farm road outside a town, at 13 h in clear weather, at the fixed camera of the earlier attribution configs.
# Measures the ambient-occlusion volume and road clip-origin fixes against same-schedule variants with each switched off.
name = "coverage-farms-fixes"
warmup_frames = 30
samples = 3
interval_seconds = 2.0

[diagnostics]
shader_identity = true

[scene]
position = [-883.5768, 1128.3473, 1738.3173]
orientation = [0.0009765624, 0.9847269, 0.0019378061, 0.17409252]

[scene.environment]
hour = 13.0
weather = "sunny"

[scene.stage]
settle_seconds = 20.0

[scene.stage.location]
position = [-883.7, 1126.6, 1738.3]
yaw_deg = 157.0


[[configurations]]
mode = "left_only"

[[configurations]]
mode = "right_only"

[[configurations]]
mode = "multipass"

[[configurations]]
mode = "single_pass"

[[single_pass_variants]]
name = "repeat"

[[single_pass_variants]]
name = "ao-volumes-off"
switches = { ao_volumes_per_eye = false }

[[single_pass_variants]]
name = "clip-origin-off"
switches = { clip_origin_per_eye = false }
