# The haptics' tuning: `HapticsTuning` in `crates/jc3vr-input/src/haptics/tuning.rs`, whose fields
# say what each value does, loaded by the view crate (`HAPTICS` in `src/tuning.rs`). Every key is
# required and no other is accepted. Amplitudes, strengths, and shares are in `0..1`, durations
# seconds, and frequencies hertz. A primitive is `Tick`, `Click`, `Bump`, `Thud`, `Buzz`, `Hum`, or
# `Tension`; a one-off cue's length is `Normal` or `Long`.

long_factor = 3.5

[vocabulary.tick]
soft = 0.06
full = 0.25
duration_s = 0.008
frequency_hz = 320.0

[vocabulary.click]
soft = 0.15
full = 0.55
duration_s = 0.02
frequency_hz = 250.0

[vocabulary.bump]
soft = 0.12
full = 0.75
duration_s = 0.04
frequency_hz = 160.0

[vocabulary.thud]
soft = 0.4
full = 1.0
duration_s = 0.07
frequency_hz = 90.0

[vocabulary.buzz]
soft = 0.2
full = 0.6
duration_s = 0.14
frequency_hz = 200.0

[vocabulary.hum]
soft = 0.0
full = 0.7
duration_s = 0.1
frequency_hz = 70.0

[vocabulary.tension]
soft = 0.0
full = 0.6
duration_s = 0.06
frequency_hz = 130.0

[mix]
sustain_knee = 0.45
sustain_ceiling = 0.7
knee = 0.85
stack_share = 0.35
duck_share = 0.5
refresh_s = 0.1

