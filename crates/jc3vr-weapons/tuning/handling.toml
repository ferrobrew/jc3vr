# The gun handling's tuning: `HandlingTuning` in `src/controllers/weapons/handling_tuning.rs`, whose
# section types (each with the subsystem that reads it) say what each value does. Every key is
# required and no other is accepted. Lengths are metres, angles degrees, times seconds (`_s`) or
# whole milliseconds (`_ms`), stiffnesses per second squared; a share is a fraction in `0..1`.

[heft]
reach_near_m = 0.3
reach_far_m = 0.65
sway_hz = 0.35
sway_yaw_ratio = 0.618
sway_yaw_phase = 1.3
sway_yaw_share = 0.8
sway_near_share = 0.5
max_angle_deg = 40.0
target_ms = 500
max_gap_ms = 250

[heft.sidearm]
sag_deg = 0.0
reach_sag_deg = 0.0
lag_stiffness = 0.0
lag_damping_ratio = 1.0
sway_deg = 0.0
kick_scale = 1.0
spread_scale = 1.0

[heft.rifle]
sag_deg = 8.0
reach_sag_deg = 10.0
lag_stiffness = 90.0
lag_damping_ratio = 0.6
sway_deg = 0.9
kick_scale = 1.4
spread_scale = 1.8

[heft.heavy]
sag_deg = 16.0
reach_sag_deg = 14.0
lag_stiffness = 30.0
lag_damping_ratio = 0.55
sway_deg = 1.8
kick_scale = 1.8
spread_scale = 2.5

[heft.braced]
strength = 1.0
max_angle_deg = 8.0

[heft.braced.smg]
sag_deg = 0.5
stiffness = 5000.0

[heft.braced.rifle]
sag_deg = 1.5
stiffness = 1600.0

[heft.braced.heavy]
sag_deg = 3.0
stiffness = 500.0

[recoil]
kick_back_m_per_rad = 0.5
max_angle_deg = 25.0
spring_stiffness = 400.0
spring_damping_ratio = 0.8
two_hand_stiffness_scale = 2.0
two_hand_kick_scale = 0.5
max_gap_ms = 250

[foregrip]
radius_m = 0.10
release_distance_m = 0.15
blend_s = 0.12
fallback_distance_m = 0.32
min_span_m = 0.08
max_turn_deg = 70.0

[ads]
engage_m = 0.06
lock_m = 0.02
max_eye_behind_m = 0.4
eye_behind_fade_m = 0.05
max_view_angle_deg = 30.0
full_view_angle_deg = 20.0
pivot_ahead_m = 0.35
butt_behind_grip_m = 0.22
shoulder_engage_m = 0.12
shoulder_lock_m = 0.04
weld_engage_m = 0.05
weld_lock_m = 0.015
ease_s = 0.06
max_ease_step_s = 0.1
half_ipd_m = 0.032
taken_share = 0.99
# Given for the right shoulder in the torso's frame (+X right, +Y up, -Z forward).
pocket_offset_m = [-0.06, -0.04, -0.04]

[scope]
scoped_ms = 250

[scope.lens]
zoom = 4.0
lens_radius_m = 0.02
eyepiece_back_m = 0.8
max_eye_distance_m = 0.15
vignette_start = 0.7
min_focus_m = 1.0

[collide]
tip_margin_m = 0.03
max_turn_deg = 70.0
max_retract_m = 0.35
keep_s = 0.15

[grip_watch]
flip_deg = 90.0
sweep_deg = 60.0
sweep_rearm_share = 0.5
sweep_hold_ms = 100
record_ms = 250

[opening]
closed = 0.6
open = 0.35
