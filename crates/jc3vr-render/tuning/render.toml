# The render layer's tuning: `RenderTuning` in `src/tuning.rs`, whose fields say what each value
# does. Every key is required and no other is accepted. Lengths are metres, angles degrees, and
# times milliseconds where the key says so.

[scope_lens]
max_copy_age_ms = 100

[taa]
clip_gamma = 1.0
depth_tolerance = 0.1

[camera_cut]
ndc = 0.5
probe_depth_m = 2.0

[culling]
size_cull_fov_deg = 50.0
spawn_budget_scale = 2.0

[terrain]
detail_budget_scale = 4
