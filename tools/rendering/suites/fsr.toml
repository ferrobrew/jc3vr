# FSR's measurements: the motion vectors FSR is handed at the coastal town (the `motion-*` scenes,
# read with `fsr-motion`) and its image against the game's own anti-aliasing, no anti-aliasing, and a
# supersampled reference at the town and the meadow (the `quality-*` scenes, read with
# `fsr-quality`). The `*-slow` scenes pan slowly and are run with `--next-frame-repeat`, so the
# repeat is the next frame and the flicker measures shimmer in motion. See docs/mod/rendering/fsr.md.
#
#   python3 -m tools.rendering fast --session N --suite tools/rendering/suites/fsr.toml \
#       --only motion-static motion-rotation motion-translation motion-index motion-shipped \
#       --planes final velocity fsr_motion fsr_depth --save --no-repeat
#   python3 -m tools.rendering fast --session N --suite tools/rendering/suites/fsr.toml \
#       --only quality-static quality-rotation quality-translation quality-meadow-static \
#       quality-meadow-rotation quality-meadow-translation --save
#   python3 -m tools.rendering fast --session N --suite tools/rendering/suites/fsr.toml \
#       --only quality-slow quality-meadow-slow --save --next-frame-repeat

[[scene]]
name = "motion-static"
config = "fsr_motion_static.toml"

[[scene]]
name = "motion-rotation"
config = "fsr_motion_rotation.toml"

[[scene]]
name = "motion-translation"
config = "fsr_motion_translation.toml"

[[scene]]
name = "motion-index"
config = "fsr_motion_rotation.toml"
headset = "index"

