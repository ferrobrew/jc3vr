# Synthetic: the recording is written by `cargo run -p tracking-synth` to
# testing/recordings/synthetic/stick_strafe_and_turn.jc3trk. See docs/mod/testing/recorder.md.
name = "synthetic: strafing and turning with the sticks"
description = "Strafe right then left with the left stick, flick the right stick right twice, then hold it left."
recording = "../recordings/synthetic/stick_strafe_and_turn.jc3trk"
start = "in_place"
pacing = "real_time"

[[expect]]
signal = "replay.driving"

[[expect]]
name = "the recorded recenter, and only it, is applied"
signal = "vr.recenters"
equals = 1

[[expect]]
signal = "controllers.frame_fresh"

[[expect]]
name = "the player stays on foot"
signal = "controllers.on_foot"
check = "always"

[[expect]]
name = "the skeleton rigs"
signal = "procedural.rig_error"
check = "never"

[[expect]]
name = "the stick drives the body"
signal = "locomotion.stick_speed_mps"
check = "eventually"
above = 1.0

[[expect]]
status = "STICK VELOCITY"

# The body rig (docs/mod/body/rig.md). The thresholds follow the rig's unit tests and are
# provisional until a replay against this build confirms them. Replay on open, level ground: a wall
# or a slope nearby obstructs the steps and fails the open-floor checks.

[[expect]]
name = "the head never asks for a step"
signal = "rig.residual_m"
check = "always"
below = 0.05

[[expect]]
name = "the root stays under the head"
signal = "rig.gap_m"
check = "always"
below = 0.05

# The stick moves the room and the body together, so the head never leaves the pelvis.
[[expect]]
name = "the stick commits no step"
signal = "rig.stepping"
check = "never"

[[expect]]
name = "nothing obstructs the steps"
signal = "rig.obstructed"
check = "never"

[[expect]]
name = "nothing is pushed back"
signal = "rig.pushbacks"
at_most = 0

# A guess: a character context that filters the wanted velocity sends steps to the projection.
[[expect]]
name = "every step's drive is credited exactly"
signal = "rig.ledger_projected"
at_most = 0

# Not checked, for want of a signal: the flicks snap the view once each under the snap
# scheme, the held push turns it smoothly under the smooth scheme, and the strafe does not turn
# the body.
